aid: raus
name: Raus
description: >-
  Raus (operated by StayRaus GmbH, Berlin) is a consumer platform for booking
  sustainable, design-forward tiny cabins in nature across Germany and Austria,
  giving city dwellers a quick escape "close to home." Guests browse and book
  fully-equipped smart cabins in forests, by lakes, and on farms, add culinary
  experiences and extras, buy gift cards, and can list their own land as a host.
  Raus was surfaced as a portfolio company of Speedinvest and added to the API
  Evangelist network. It is a B2C hospitality/booking brand with a public
  consumer website but no publicly documented API, developer portal, SDKs, or
  developer documentation as of this enrichment pass.
